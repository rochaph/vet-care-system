spring:
  application:
    name: appointments
  config:
    import: optional:file:../../infra/docker-compose/.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

vetcare:
  clinic:
    name: Clínica Vet Care
    opening-hours: "08:00-18:00"
