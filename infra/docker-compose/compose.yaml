name: vet-care-system
services:
  appointments-db:
    image: postgres:18
    container_name: appointments-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?defina no .env}
      POSTGRES_USER: ${POSTGRES_USER:?defina no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no .env}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "${POSTGRES_USER:?defina no .env}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - db_data:/var/lib/postgresql

volumes:
  db_data:
    driver: local
